name: Linux Build (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Build
        run: packaging/linux/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dexkeeper-linux-unsigned
          path: |
            dist/linux/DexKeeper.AppImage
