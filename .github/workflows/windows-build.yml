name: Windows Build (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build
        shell: pwsh
        run: packaging\windows\build.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dexkeeper-windows-unsigned
          path: |
            dist\windows\DexKeeper.exe
            dist\windows\DexKeeper-Setup.exe

      - name: Publish GitHub Release (tagged builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist\windows\DexKeeper.exe
            dist\windows\DexKeeper-Setup.exe
