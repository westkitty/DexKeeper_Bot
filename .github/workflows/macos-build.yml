name: macOS Build (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        run: packaging/macos/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dexkeeper-macos-unsigned
          path: |
            dist/macos/DexKeeper.app
            dist/macos/DexKeeper.dmg
